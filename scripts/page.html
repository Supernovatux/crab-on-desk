<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { position: relative; }
  #stage { position: relative; width: 100%; height: calc(100% - 1px); overflow: hidden; }
  #stamp { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; }
  #pet { position: absolute; display: block; pointer-events: none; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="stamp"></div>
<script>
const FRAME_RATE = 15;
const FRAME_MS = 1000 / FRAME_RATE;
const MAX_LOOP_MS = 20000;
const SVG_NS = "http://www.w3.org/2000/svg";
const NON_RENDERING = new Set([
  "defs", "style", "title", "desc", "metadata", "script", "clipPath", "mask",
  "linearGradient", "radialGradient", "pattern", "filter", "marker", "symbol",
]);
const RUN_ATTRIBUTE = "data-crab-run";
const VIRTUAL_CLOCK = `<script><![CDATA[
(() => {
  let now = 0;
  let nextId = 1;
  let seed = 1;
  const callbacks = new Map();
  performance.now = () => now;
  Math.random = () => {
    seed = (seed * 16807) % 2147483647;
    return (seed - 1) / 2147483646;
  };
  window.requestAnimationFrame = (callback) => { callbacks.set(nextId, callback); return nextId++; };
  window.cancelAnimationFrame = (id) => callbacks.delete(id);
  window.__crabAdvanceClock = (time) => {
    now = time;
    const pending = [...callbacks.values()];
    callbacks.clear();
    for (const callback of pending) callback(now);
  };
})();
]]><\/script>`;

let clip = null;
let seeks = 0;
const stage = document.getElementById("stage");
const stamp = document.getElementById("stamp");

function nextPaint() {
  return new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
}

function applyStyle(element, style) {
  for (const [key, value] of Object.entries(style)) element.style[key] = value;
}

async function withVirtualClock(url) {
  const text = await (await fetch(url)).text();
  const clocked = text.replace(/<svg\b[^>]*>/, (open) => open + VIRTUAL_CLOCK);
  return URL.createObjectURL(new Blob([clocked], { type: "image/svg+xml" }));
}

async function loadSvg(url, style, scriptedCycleMs) {
  const object = document.createElement("object");
  object.id = "pet";
  object.type = "image/svg+xml";
  applyStyle(object, style);
  const loaded = new Promise((resolve, reject) => {
    object.onload = resolve;
    object.onerror = () => reject(new Error(`cannot load ${url}`));
  });
  object.data = scriptedCycleMs ? await withVirtualClock(url) : url;
  stage.replaceChildren(object);
  await loaded;
  await nextPaint();
  const svgWindow = object.contentDocument.defaultView;
  const svg = object.contentDocument.documentElement;
  if (svg.querySelector("animate, animateTransform, animateMotion, set")) {
    throw new Error(`${url} uses SMIL animation, which is not supported`);
  }
  const animations = object.contentDocument.getAnimations();
  for (const animation of animations) animation.pause();
  const timings = animations.map((animation) => animation.effect.getComputedTiming());
  const finite = timings.filter((timing) => Number.isFinite(timing.endTime));
  const loops = finite.length === 0;
  const periods = timings.map(iterationPeriod);
  if (scriptedCycleMs) periods.push(scriptedCycleMs);
  const lengthMs = loops ? loopPeriodMs(periods) : Math.max(...finite.map((t) => t.endTime));
  const frameCount = Math.max(1, Math.round(lengthMs / FRAME_MS));
  clip = {
    frameCount,
    loops,
    object,
    delays: Array(frameCount).fill([1, FRAME_RATE]),
    seek: (index) => {
      const time = Math.min(index * FRAME_MS, loops ? Infinity : lengthMs);
      for (const animation of object.contentDocument.getAnimations()) {
        animation.pause();
        animation.currentTime = time;
      }
      if (scriptedCycleMs) svgWindow.__crabAdvanceClock(time);
    },
  };
  return { frameCount, loops, lengthMs };
}

function gcd(a, b) {
  return b === 0 ? a : gcd(b, a % b);
}

function iterationPeriod(timing) {
  const iteration = Math.round(timing.duration);
  return timing.direction && timing.direction.startsWith("alternate") ? iteration * 2 : iteration;
}

function loopPeriodMs(allPeriods) {
  const periods = [...new Set(allPeriods.filter((period) => period > 0))];
  if (periods.length === 0) return 0;
  const lcm = periods.reduce((acc, period) => (acc * period) / gcd(acc, period), 1);
  if (lcm <= MAX_LOOP_MS) return lcm;
  const seamError = (length) =>
    periods.reduce((sum, period) => {
      const remainder = length % period;
      return sum + Math.min(remainder, period - remainder);
    }, 0);
  const firstFrames = Math.ceil(Math.max(...periods) / FRAME_MS);
  let best = firstFrames * FRAME_MS;
  for (let frames = firstFrames; frames * FRAME_MS <= MAX_LOOP_MS; frames += 1) {
    if (seamError(frames * FRAME_MS) < seamError(best)) best = frames * FRAME_MS;
  }
  return best;
}

async function loadApng(url, style) {
  const canvas = document.createElement("canvas");
  canvas.id = "pet";
  applyStyle(canvas, style);
  const data = await (await fetch(url)).arrayBuffer();
  const decoder = new ImageDecoder({ data, type: "image/png" });
  await decoder.tracks.ready;
  const track = decoder.tracks.selectedTrack;
  await decoder.completed;
  const frames = [];
  for (let frameIndex = 0; frameIndex < track.frameCount; frameIndex += 1) {
    frames.push((await decoder.decode({ frameIndex })).image);
  }
  const first = frames[0];
  canvas.width = first.displayWidth;
  canvas.height = first.displayHeight;
  stage.replaceChildren(canvas);
  const context = canvas.getContext("2d");
  const loops = track.repetitionCount !== 0;
  clip = {
    frameCount: frames.length,
    loops,
    delays: frames.map((frame) => [Math.max(1, Math.round((frame.duration || 0) / 1000)), 1000]),
    seek: (index) => {
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.drawImage(frames[index], 0, 0);
    },
  };
  return { frameCount: frames.length, loops };
}

function rendered(element) {
  return element.namespaceURI === SVG_NS && !NON_RENDERING.has(element.localName);
}

function pixelsPerUnit(element) {
  const matrix = element.parentNode.getScreenCTM();
  return [Math.hypot(matrix.a, matrix.b), Math.hypot(matrix.c, matrix.d)];
}

function trackedElements(document, layers) {
  const tracked = new Map();
  layers.forEach((layer, index) => {
    const selectors = [...layer.ids.map((id) => `#${CSS.escape(id)}`), ...layer.classes.map((name) => `.${CSS.escape(name)}`)];
    if (selectors.length === 0) return;
    for (const element of document.querySelectorAll(selectors.join(","))) {
      if (!tracked.has(element)) tracked.set(element, layer);
    }
  });
  return tracked;
}

function paintedLeaves(root, tracked) {
  const leaves = [];
  const visit = (element, chain) => {
    const own = tracked.has(element) ? [...chain, element] : chain;
    const children = [...element.children].filter(rendered);
    if (children.length === 0 || element.localName === "text") leaves.push({ element, chain: own });
    else for (const child of children) visit(child, own);
  };
  visit(root, []);
  return leaves;
}

function sameLayers(tracked, a, b) {
  return a.length === b.length && a.every((element, index) => tracked.get(element) === tracked.get(b[index]));
}

window.trackingRuns = ({ layers, anchorRatio }) => {
  const document = clip.object.contentDocument;
  const tracked = trackedElements(document, layers);
  if (tracked.size === 0) return null;
  const runs = [];
  for (const leaf of paintedLeaves(document.documentElement, tracked)) {
    const last = runs[runs.length - 1];
    if (last && sameLayers(tracked, last.chain, leaf.chain)) last.leaves.push(leaf.element);
    else runs.push({ chain: leaf.chain, leaves: [leaf.element] });
  }
  runs.forEach((run, index) => run.leaves.forEach((leaf) => leaf.setAttribute(RUN_ATTRIBUTE, index)));
  const style = document.createElementNS(SVG_NS, "style");
  style.id = "crab-run-style";
  document.documentElement.append(style);
  const box = clip.object.getBoundingClientRect();
  return {
    anchor: [box.left + box.width * anchorRatio[0], box.top + box.height * anchorRatio[1]],
    layers: runs.map(({ chain }) => {
      const innermost = tracked.get(chain[chain.length - 1]);
      const max_offset = chain.reduce(
        ([x, y], element) => {
          const [unitX, unitY] = pixelsPerUnit(element);
          const [offsetX, offsetY] = tracked.get(element).maxOffset;
          return [x + offsetX * unitX, y + offsetY * unitY];
        },
        [0, 0],
      );
      return { max_offset, ease: innermost ? innermost.ease : 0, stretch_x: innermost ? innermost.stretchX : 0 };
    }),
  };
};
window.showRun = (run) => {
  clip.object.contentDocument.getElementById("crab-run-style").textContent =
    `[${RUN_ATTRIBUTE}] { visibility: hidden !important; } [${RUN_ATTRIBUTE}="${run}"] { visibility: visible !important; }`;
};
window.loadClip = (kind, url, style, scriptedCycleMs) =>
  kind === "svg" ? loadSvg(url, style, scriptedCycleMs) : loadApng(url, style);
window.clipDelays = () => clip.delays;
window.showFrame = async (index) => {
  clip.seek(index);
  seeks = (seeks % 0xffffff) + 1;
  stamp.style.background = `#${seeks.toString(16).padStart(6, "0")}`;
  await nextPaint();
  return seeks;
};
</script>
</body>
</html>
