[package]
name = "crab-widget"
version = "0.1.0"
edition = "2024"

[dependencies]
calloop = "0.14.4"
calloop-wayland-source = "0.4.1"
crab-common = { version = "0.1.0", path = "../crab-common" }
gl = "0.14.0"
glutin = { version = "0.32.3", default-features = false, features = ["egl", "wayland"] }
hyprland = { version = "0.4.0-beta.3", default-features = false, features = ["data"] }
ktx2 = "0.5.0"
memmap2 = "0.9.11"
raw-window-handle = "0.6.2"
rustix = { version = "1.1.5", features = ["net", "process"] }
serde_json = "1.0.151"
smithay-client-toolkit = "0.21.1"
snafu.workspace = true
wayland-client = "0.31.15"
wayland-egl = "0.32.11"

[lints]
workspace = true
